[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[project]
name = "apex-quant-xauusd"
version = "19.0.0"
description = "Institutional Quantitative Trading Engine for XAUUSD (Spot Gold)"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26.0,<3.0.0",
    "pandas>=2.2.0,<3.0.0",
    "requests>=2.32.0,<3.0.0",
    "scikit-learn>=1.5.0,<2.0.0",
    "scipy>=1.13.0,<2.0.0",
]

[project.scripts]
apex-quant = "apex_quant.cli:main"

[tool.ruff]
target-version = "py310"
line-length = 105

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
