# ═══════════════════════════════════════════════════════════════════════════
# APEX Predator v19 — Unified Workflow (Scheduled + Manual)
# ═══════════════════════════════════════════════════════════════════════════
# Scheduled: auto-trigger cron selama killzone London + NY
# Manual:    workflow_dispatch untuk test/audit/backtest/health
# ═══════════════════════════════════════════════════════════════════════════

name: APEX Predator v19

on:
  schedule:
    - cron: '*/5 7-11,13-17,18-22 * * 1-5'
  workflow_dispatch:
    inputs:
      command:
        description: 'Command'
        required: true
        default: 'test'
        type: choice
        options:
          - test
          - run
          - audit
          - health
          - state
          - backtest
      dry_run:
        description: 'Dry run (no Telegram)'
        required: false
        type: boolean
        default: true
      csv_url:
        description: 'CSV URL (backtest only)'
        required: false
        type: string

concurrency:
  group: apex-trading
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  apex:
    name: ${{ inputs.command || 'scheduled-run' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-v19-numpy-pandas-requests-sklearn-scipy

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            "numpy>=1.24,<3.0" \
            "pandas>=2.0,<3.0" \
            "requests>=2.31,<3.0" \
            "scikit-learn>=1.3,<2.0" \
            "scipy>=1.11,<2.0"

      - name: Download CSV (backtest only)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.command == 'backtest' && inputs.csv_url != '' }}
        run: |
          curl -fSL --retry 3 --retry-delay 5 -o /tmp/xauusd.csv "${{ inputs.csv_url }}"
          echo "✅ Downloaded $(wc -l < /tmp/xauusd.csv) lines"

      - name: Validate backtest input
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.command == 'backtest' && inputs.csv_url == '' }}
        run: |
          echo "::error::backtest requires 'csv_url' input. Provide a direct URL to XAUUSD M5 CSV."
          exit 1

      - name: Execute APEX
        env:
          GIST_ID:                        ${{ secrets.GIST_ID }}
          GIST_TOKEN:                     ${{ secrets.GIST_TOKEN }}
          TELEGRAM_TOKEN:                 ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID:               ${{ secrets.TELEGRAM_CHAT_ID }}
          TWELVE_DATA_API_KEY:            ${{ secrets.TWELVE_DATA_API_KEY }}
          OANDA_API_KEY:                  ${{ secrets.OANDA_API_KEY }}
          APEX_SYMBOL:                    ${{ vars.APEX_SYMBOL                    || 'XAUUSD' }}
          APEX_BALANCE:                   ${{ vars.APEX_BALANCE                   || '1000.0' }}
          APEX_RISK_PCT:                  ${{ vars.APEX_RISK_PCT                  || '1.0' }}
          APEX_MAX_DAILY_LOSS:            ${{ vars.APEX_MAX_DAILY_LOSS            || '3.0' }}
          APEX_MAX_CONSEC_LOSSES:         ${{ vars.APEX_MAX_CONSEC_LOSSES         || '3' }}
          APEX_ALLOW_RANGING:             ${{ vars.APEX_ALLOW_RANGING             || 'true' }}
          APEX_ENFORCE_HTF_FILTER:        ${{ vars.APEX_ENFORCE_HTF_FILTER        || 'true' }}
          APEX_COUNTER_TREND_ALLOW_RATIO: ${{ vars.APEX_COUNTER_TREND_ALLOW_RATIO || '0.85' }}
          APEX_DRY_RUN:                   ${{ inputs.dry_run && 'true' || 'false' }}
          APEX_COMMAND:                   ${{ github.event_name == 'schedule' && 'run' || inputs.command }}
          APEX_CSV:                       ${{ inputs.csv_url != '' && '/tmp/xauusd.csv' || '' }}
        run: |
          set -e
          CMD="$APEX_COMMAND"
          echo "▶ Executing: apex.py $CMD"
          if [ "$CMD" = "backtest" ]; then
            python apex.py backtest --csv "$APEX_CSV" -v 2>&1 | tee apex.log
          else
            python apex.py "$CMD" -v 2>&1 | tee apex.log
          fi

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apex-${{ inputs.command || 'scheduled' }}-${{ github.run_id }}
          path: apex.log
          retention-days: 7
          if-no-files-found: ignore
