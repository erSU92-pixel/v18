name: APEX QUANT XAUUSD Live Runner

on:
  schedule:
    # Runs every 5 minutes Monday-Friday (XAUUSD trading days)
    - cron: "*/5 * * * 1-5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Execute in dry-run mode (no live orders or Telegram alerts)"
        required: false
        default: "true"
        type: boolean

# Prevent overlapping workflow runs from racing on Gist state
concurrency:
  group: apex-quant-xauusd-runner
  cancel-in-progress: false

jobs:
  trade-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 4

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute APEX QUANT cycle
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          OANDA_API_KEY: ${{ secrets.OANDA_API_KEY }}
          OANDA_ACCOUNT_ID: ${{ secrets.OANDA_ACCOUNT_ID }}
          OANDA_ENV: ${{ vars.OANDA_ENV || 'practice' }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GIST_ID: ${{ secrets.GIST_ID }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          APEX_BALANCE: ${{ vars.APEX_BALANCE || '1000.0' }}
          APEX_RISK_PCT: ${{ vars.APEX_RISK_PCT || '1.0' }}
          APEX_EXECUTION_MODE: ${{ vars.APEX_EXECUTION_MODE || 'signal_only' }}
          APEX_DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: python main.py run
