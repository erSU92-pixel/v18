name: Apex Quant XAUUSD Institutional Runner

on:
  schedule:
    # Berjalan setiap 5 menit Senin - Jumat
    - cron: '*/5 * * * 1-5'
  workflow_dispatch:

concurrency:
  group: apex-quant-runner
  cancel-in-progress: false

jobs:
  run-apex-quant:
    name: Execute Apex Predator v18.0
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Quant Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas requests scikit-learn scipy python-dotenv

      - name: Run Apex Predator Engine
        env:
          GIST_ID: ${{ secrets.GIST_ID }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          OANDA_API_KEY: ${{ secrets.OANDA_API_KEY }}
          APEX_SYMBOL: "XAUUSD"
          APEX_BALANCE: "1000.0"
          APEX_RISK_PCT: "1.0"
          APEX_MAX_DAILY_LOSS: "3.0"
          APEX_MAX_CONSEC_LOSSES: "3"
          APEX_ALLOW_RANGING: "true"
          APEX_ENFORCE_HTF_FILTER: "true"
          APEX_COUNTER_TREND_ALLOW_RATIO: "0.85"
          APEX_SKIP_KILLZONE_FILTER: "false"
          APEX_DRY_RUN: "false"
        run: |
          python apex_v18.py run
