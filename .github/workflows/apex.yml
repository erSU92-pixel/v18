name: APEX

on:
  schedule:
    - cron: '*/5 * * * 1-5'   # 24/5, tiap 5 menit, Senin-Jumat
  workflow_dispatch:           # tombol manual, langsung jalan

concurrency:
  group: apex
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip -q
          pip install -q "numpy>=1.24,<3.0" "pandas>=2.0,<3.0" "requests>=2.31,<3.0" "scikit-learn>=1.3,<2.0" "scipy>=1.11,<2.0"
      - name: Run
        env:
          GIST_ID:                        ${{ secrets.GIST_ID }}
          GIST_TOKEN:                     ${{ secrets.GIST_TOKEN }}
          TELEGRAM_TOKEN:                 ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID:               ${{ secrets.TELEGRAM_CHAT_ID }}
          TWELVE_DATA_API_KEY:            ${{ secrets.TWELVE_DATA_API_KEY }}
          OANDA_API_KEY:                  ${{ secrets.OANDA_API_KEY }}
          APEX_SYMBOL:                    XAUUSD
          APEX_BALANCE:                   ${{ vars.APEX_BALANCE                   || '1000.0' }}
          APEX_RISK_PCT:                  ${{ vars.APEX_RISK_PCT                  || '1.0' }}
          APEX_MAX_DAILY_LOSS:            ${{ vars.APEX_MAX_DAILY_LOSS            || '3.0' }}
          APEX_MAX_CONSEC_LOSSES:         ${{ vars.APEX_MAX_CONSEC_LOSSES         || '3' }}
          APEX_ALLOW_RANGING:             ${{ vars.APEX_ALLOW_RANGING             || 'true' }}
          APEX_ENFORCE_HTF_FILTER:        ${{ vars.APEX_ENFORCE_HTF_FILTER        || 'true' }}
          APEX_COUNTER_TREND_ALLOW_RATIO: ${{ vars.APEX_COUNTER_TREND_ALLOW_RATIO || '0.85' }}
          APEX_SKIP_KILLZONE_FILTER:      'true'
          APEX_DRY_RUN:                   'false'
        run: python apex.py run -v
